# Tests run against an in-memory H2 database instead of MySQL.
# Flyway builds it from the same migrations as production, so the seed data is available to tests.
spring.datasource.url=jdbc:h2:mem:portfolio;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Tests replace JavaMailSender with a mock, so no email is ever sent.
app.contact.recipient=owner@example.test
spring.mail.username=portfolio@example.test
