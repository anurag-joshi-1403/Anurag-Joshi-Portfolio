spring.application.name=portfolio

# Local secrets live in backend/.env (git-ignored, see .env.example).
# In production the same names are set as environment variables on Render/Railway.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# --- Database (MySQL) ---
# PORTFOLIO_ prefix: generic names like DB_USERNAME are often set machine-wide by other projects,
# and OS environment variables override backend/.env.
spring.datasource.url=${PORTFOLIO_DB_URL:jdbc:mysql://localhost:3306/spring_boot_db?createDatabaseIfNotExist=true}
spring.datasource.username=${PORTFOLIO_DB_USERNAME:root}
spring.datasource.password=${PORTFOLIO_DB_PASSWORD:}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# spring_boot_db may already hold tables from other projects. Baselining at version 0
# lets Flyway adopt such a database and still run V1 and every later migration.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- Contact form email (Spring Mail) ---
# Defaults suit Gmail: MAIL_USERNAME is the Gmail address, MAIL_PASSWORD a Google app password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Fail within seconds instead of leaving the visitor's request hanging when SMTP is unreachable.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Inbox that receives contact-form messages.
app.contact.recipient=${CONTACT_RECIPIENT:}
# At most this many sends per visitor IP per window (ISO-8601 duration).
app.contact.rate-limit.max-requests=5
app.contact.rate-limit.window=PT1H

# Render and Railway sit behind a proxy: take the visitor's IP from X-Forwarded-For,
# trusting it only when the request arrives from a private-network proxy address.
server.forward-headers-strategy=native

# --- CORS ---
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# --- Health check (GET /actuator/health), used to confirm the database connection ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
# Don't open an SMTP connection on every health probe; /api/contact reports mail failures itself.
management.health.mail.enabled=false
